version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  commit-message:
      prefix: "chore"
      include: "scope"
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: monthly
  groups:
    typst:
      patterns: ["typst*"]
    arborium:
      patterns: ["arborium*"]
    crates:
      patterns: ["*"]
      update-types: ["patch"]
  ignore:
  - dependency-name: ttf-parser
  - dependency-name: unicode-math-class
  commit-message:
      prefix: "chore"
      include: "scope"
