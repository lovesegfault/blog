version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  commit-message:
      prefix: "chore"
      include: "scope"
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: monthly
  groups:
    crates:
      patterns: ["*"]
  commit-message:
      prefix: "chore"
      include: "scope"
