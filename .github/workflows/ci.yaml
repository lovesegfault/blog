name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: rustfmt
        run: nix shell --inputs-from . nixpkgs#{cargo,rustfmt} -c cargo fmt --all --check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: actions/cache@v5
        with:
          path: ~/built
          key: ${{ runner.os }}-${{ hashFiles('flake.*', 'Cargo.*', '.cargo/**', 'crates/**') }}
      - name: nix-build
        run: |
          nix copy --no-check-sigs --from "file://$HOME/built" "$(nix eval --raw .#forno)" "$(nix eval --raw .#programs)" || true
          nix build -L
          nix copy --to "file://$HOME/built" .#forno .#programs
      - name: nix-flake-check
        run: nix flake check -L
