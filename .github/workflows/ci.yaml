name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: markdownlint
        run: nix run --inputs-from . nixpkgs#markdownlint-cli -- README.md content
      - name: rustfmt
        run: nix shell --inputs-from . nixpkgs#{cargo,rustfmt} -c cargo fmt --all --check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: nix-build
        run: nix build -L
      - name: nix-flake-check
        run: nix flake check -L
