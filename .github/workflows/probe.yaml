name: probe
on:
  push:
    branches: [claude/adoring-lovelace-dlln4c]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: versions
        run: nix --version; git status --short
      - name: candidate
        run: |
          nix build -L --out-link "$RUNNER_TEMP/new"
      - name: baseline
        if: always()
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" origin/master
          cd "$RUNNER_TEMP/base"
          git lfs pull
          nix build -L --out-link "$RUNNER_TEMP/old"
      - name: check
        if: always()
        run: nix flake check -L
      - name: lint
        if: always()
        run: nix develop -c mdl content
      - name: devshell
        if: always()
        run: |
          nix develop -c bash -c '
            for c in "hugo version" "git-lfs version" "mdl --version" "nil --version" "nixfmt --version" "pre-commit --version" "proselint --version" "statix --version" "ltex-ls-plus --version"; do
              echo "## $c"; $c 2>&1 || echo "EXIT $? ($c)"
            done
            echo "## nixfmt --check"; nixfmt --check flake.nix; echo "exit $?"
            cp flake.nix "$RUNNER_TEMP/f.nix"; nixfmt "$RUNNER_TEMP/f.nix"; diff -u flake.nix "$RUNNER_TEMP/f.nix"
            echo "## statix"; statix check; echo "exit $?"
            echo "## hugo info"; hugo --minify --logLevel info --printPathWarnings -d "$RUNNER_TEMP/info"; echo "exit $?"
            echo "## hugo drafts"; hugo -D -d "$RUNNER_TEMP/drafts"; echo "exit $?"
            echo "## hugo server"; hugo server --port 1313 > "$RUNNER_TEMP/server.log" 2>&1 & p=$!
            for i in $(seq 1 30); do curl -fs localhost:1313/ >/dev/null && break; sleep 1; done
            for u in / /about/ /terminal.css /favicon.png /posts/arch-on-the-nspire/ /page/2/ /index.xml /nope; do echo "$(curl -s -o /dev/null -w %{http_code} localhost:1313$u) $u"; done
            kill $p; cat "$RUNNER_TEMP/server.log"
            echo "## archetype"; hugo new content posts/probe-post.md && cat content/posts/probe-post.md; rm -f content/posts/probe-post.md
          '
      - name: actionlint
        if: always()
        run: |
          d="$(mktemp -d)"
          git archive HEAD^ .github | tar -x -C "$d"
          nix run --inputs-from . nixpkgs#actionlint -- "$d"/.github/workflows/*.yaml
      - name: pre-commit
        if: always()
        run: |
          git checkout -q HEAD^
          nix develop -c pre-commit run --all-files --show-diff-on-failure
          git checkout -qf "$GITHUB_SHA"
      - name: export
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          mkdir out
          for s in old new; do cp --recursive --dereference --no-preserve=mode,ownership "$s" "out/$s"; done
          for s in old new; do
            echo "MANIFEST-BEGIN $s"
            (cd "out/$s" && find . -type f -print0 | sort -z | xargs -0 sha256sum)
            echo "MANIFEST-END $s"
          done
          find out -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.xml' -o -name '*.map' \) -print0 > list
          tar --null -T list -cJf text.tar.xz
          sha256sum text.tar.xz
          echo "TEXT-BEGIN"
          base64 -w 2000 text.tar.xz
          echo "TEXT-END"
      - uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: ${{ runner.temp }}/out

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix build -L
      - run: nix develop -c hugo version

  updater:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        persist: [true, false]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: ${{ matrix.persist }}
      - name: same auth setup as create-pull-request@v6
        env:
          TOKEN: ${{ github.token }}
        run: |
          basic="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          key="http.https://github.com/.extraheader"
          git config --local --unset-all "$key" || true
          git config --local "$key" "AUTHORIZATION: basic $basic"
          set +e
          git ls-remote origin refs/heads/master
          echo "RESULT persist=${{ matrix.persist }} exit=$?"
          git config --local --unset-all "$key"
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cpcloud/flake-dep-info-action@v2.0.11
        with:
          input: nixpkgs
      - run: nix flake lock --update-input gitignore
