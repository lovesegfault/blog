name: probe
on:
  push:
    branches: [claude/adoring-lovelace-dlln4c]

permissions: {}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix build -L --out-link "$RUNNER_TEMP/new"
      - name: lint
        run: |
          nix develop -c mdl content
          git checkout -q HEAD^
          nix develop -c pre-commit run --all-files --show-diff-on-failure
          nix run --inputs-from . nixpkgs#actionlint -- .github/workflows/*.yaml
          git checkout -qf "$GITHUB_SHA"
      - name: archetypes
        run: |
          nix develop -c bash -c '
            set -e
            for p in posts/probe-page.md posts/probe-bundle/index.md drafts/probe-draft.md; do
              hugo new content "$p"
              echo "ARCHETYPE $p"
              cat "content/$p"
            done
            hugo --minify -d "$RUNNER_TEMP/with-new-posts"
            echo "PUBLISHED-PROBE-FILES $(find "$RUNNER_TEMP/with-new-posts" -path "*probe*" | wc -l)"
            rm -r content/posts/probe-page.md content/posts/probe-bundle content/drafts/probe-draft.md
          '
      - name: server
        run: |
          nix develop -c bash -c '
            hugo server --port 1313 > /dev/null 2>&1 & p=$!
            for i in $(seq 1 30); do curl -fs localhost:1313/ > /dev/null && break; sleep 1; done
            echo "SERVER-PROD-REFS $(curl -s localhost:1313/ | grep -c lovesegfault.com)"
            echo "SERVER-LOCAL-REFS $(curl -s localhost:1313/ | grep -c localhost:1313)"
            kill $p
          '
      - name: export
        run: |
          cd "$RUNNER_TEMP"
          mkdir out
          cp --recursive --dereference --no-preserve=mode,ownership new out/new
          echo "MANIFEST-BEGIN"
          (cd out/new && find . -type f -print0 | sort -z | xargs -0 sha256sum)
          echo "MANIFEST-END"
          find out -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.xml' \) -print0 > list
          tar --null -T list -cJf text.tar.xz
          sha256sum text.tar.xz
          echo "TEXT-BEGIN"
          base64 -w 2000 text.tar.xz
          echo "TEXT-END"
      - name: updater script
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/step.sh"
          import yaml
          steps = yaml.safe_load(open('.github/workflows/update-flakes.yaml'))['jobs']['update-flake']['steps']
          print(next(s['run'] for s in steps if s.get('id') == 'update'))
          PY
          git checkout -q 78e112e400e795d7db3f7a10ed175caa27d245b6 -- flake.lock
          for input in nixpkgs utils gitignore; do
            : > "$RUNNER_TEMP/output"
            INPUT="$input" GITHUB_OUTPUT="$RUNNER_TEMP/output" bash --noprofile --norc -eo pipefail "$RUNNER_TEMP/step.sh"
            sed "s/^/UPDATER $input /" "$RUNNER_TEMP/output"
            echo "UPDATER-DONE $input"
          done
