name: update-flakes
on:
  schedule:
    - cron:  '0 0 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  get-flake-inputs:
    runs-on: ubuntu-latest
    outputs:
      flake-inputs: ${{ steps.get-flake-inputs.outputs.flake-inputs }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          sparse-checkout: flake.lock
      - id: get-flake-inputs
        run: |
          flake_inputs="$(jq -c '.nodes.root.inputs | {flake: keys}' flake.lock)"

          echo "flake-inputs=${flake_inputs}" >> "$GITHUB_OUTPUT"
  update-flake:
    name: update-${{ matrix.flake }}
    runs-on: ubuntu-latest
    needs: get-flake-inputs
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-flake-inputs.outputs.flake-inputs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: accept-flake-config = true
      - id: update
        env:
          INPUT: ${{ matrix.flake }}
        run: |
          locked() {
            jq -er --arg input "$INPUT" '.nodes[.nodes.root.inputs[$input]].locked | "\(.owner)/\(.repo) \(.rev)"' flake.lock
          }

          before="$(locked)"
          nix flake update "$INPUT"
          after="$(locked)"
          if [ "$before" = "$after" ]; then
            exit 0
          fi

          read -r repo old <<< "$before"
          read -r _ new <<< "$after"
          {
            echo "changed=true"
            echo "commit-message=chore(flake/${INPUT}): ${old:0:8} -> ${new:0:8}"
            echo "title=chore(flake/${INPUT}): \`${old:0:8}\` -> \`${new:0:8}\`"
            echo "body=https://github.com/${repo}/compare/${old}...${new}"
          } >> "$GITHUB_OUTPUT"
      - id: pr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Not GITHUB_TOKEN, as PRs opened with that don't trigger CI
          token: ${{ secrets.PAT }}
          author: hatesegfault <hatesegfault@protonmail.ch>
          committer: hatesegfault <hatesegfault@protonmail.ch>
          add-paths: flake.lock
          branch: update-${{ matrix.flake }}
          delete-branch: true
          commit-message: ${{ steps.update.outputs.commit-message }}
          title: ${{ steps.update.outputs.title }}
          body: ${{ steps.update.outputs.body }}
      - if: steps.pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: gh pr merge --auto --rebase "$PR_URL"
