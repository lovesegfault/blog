# Temporary: checks the redesign on both systems, and in Firefox and Safari. Goes away before merging.
name: verify
on:
  push:
    branches-ignore: [master, "dependabot/**", "update-*"]

permissions: {}

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - if: always()
        run: nix shell --inputs-from . nixpkgs#{cargo,rustfmt} -c cargo fmt --all --check
      - if: always()
        run: nix run --inputs-from . nixpkgs#nixfmt -- flake.nix nix/*.nix && git diff --exit-code
      - if: always()
        run: nix run --inputs-from . nixpkgs#statix -- check
      - if: always()
        run: nix run --inputs-from . nixpkgs#actionlint
      - if: always()
        run: nix run --inputs-from . nixpkgs#typstyle -- --inplace --line-width 120 blog.typ content && git diff | tee style.patch
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: style
          path: style.patch
          retention-days: 3
  browse:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            driver: geckodriver
          - os: macos-latest
            driver: safaridriver
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: actions/cache@v5
        with:
          path: ~/built
          key: ${{ runner.os }}-${{ hashFiles('flake.*', 'Cargo.*', '.cargo/**', 'crates/**') }}
      - name: nix-build
        run: |
          nix copy --all --no-check-sigs --from "file://$HOME/built"
          nix build -L
          nix copy --to "file://$HOME/built" .#forno .#programs
      - run: nix flake check -L
      - run: mkdir shots && tar -czhf shots/site.tar.gz --exclude '*.xz' --exclude '*.pdf' --exclude images result
      - if: always() && runner.os == 'macOS'
        run: sudo safaridriver --enable
      - if: always()
        run: |
          perl -pi -e 's/^  date: /  comments: false,\n  date: /' content/posts/*.typ content/posts/*/index.typ
          nix develop -c tinymist compile --root . content/drafts/specimen/index.typ shots/specimen.pdf || echo tinymist failed
          nix build .#forno .#programs
          FORNO_WASM=result-1 nix develop -c result/bin/forno serve &
          curl --retry 60 --retry-connrefused --retry-delay 1 -so /dev/null http://127.0.0.1:1313/
          curl -s http://127.0.0.1:1313/posts/specimen/ > shots/specimen.html
          MOZ_HEADLESS=1 python3 .github/browse.py ${{ matrix.driver }} || echo the driver failed
          PLAYWRIGHT_BROWSERS_PATH="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#playwright-driver.browsers)" \
            nix shell --impure --expr '(import (builtins.getFlake (toString ./.)).inputs.nixpkgs { }).python3.withPackages (p: [ p.playwright ])' \
            -c python3 .github/browse.py webkit || echo webkit failed
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shots-${{ matrix.driver }}
          path: shots
          retention-days: 3
      - if: runner.os == 'macOS'
        run: |
          nix develop -c forno build --drafts
          nix develop -c cargo clippy --workspace --all-targets -- --deny warnings
