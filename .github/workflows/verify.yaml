# Temporary: draws the valley again, from the survey and from the maps. Goes away before merging.
name: verify
on:
  push:
    branches-ignore: [master, "dependabot/**", "update-*"]

permissions: {}

jobs:
  valley:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: draw
        run: |
          time nix develop .#valley -c python valley/draw.py
          git status --short
          git diff --stat --exit-code
      - name: survey
        if: always() && runner.os == 'Linux'
        run: |
          cp valley/survey.npz kept.npz
          time nix develop .#valley -c python valley/survey.py
          nix develop .#valley -c python -c '
          import numpy as np
          a, b = np.load("kept.npz"), np.load("valley/survey.npz")
          print("SAME", {k: (str(b[k].dtype), bool(np.array_equal(a[k], b[k]))) for k in a})'
          git status --short
          git checkout valley
      - name: style
        if: always() && runner.os == 'Linux'
        run: |
          SKIP=clippy,scrub nix develop -c pre-commit run --all-files --show-diff-on-failure
          nix run --inputs-from . nixpkgs#ruff -- format --line-length 120 --diff valley || true
          nix run --inputs-from . nixpkgs#ruff -- check valley || true
