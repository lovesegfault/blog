# Temporary: builds the site from before and after a change, on both systems. Goes away before merging.
name: verify
on:
  push:
    branches-ignore: [master, "dependabot/**", "update-*"]

permissions: {}

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: SKIP=clippy,scrub nix develop -c pre-commit run --all-files --show-diff-on-failure
      - if: always()
        run: nix run --inputs-from . nixpkgs#actionlint
      - if: always()
        run: nix run --inputs-from . nixpkgs#deadnix -- --fail
  site:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        back: [0, 1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ matrix.back == 1 && 'b85c71280e732d09733718a4165ea309f4b9982c' || github.sha }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: actions/cache@v5
        with:
          path: ~/built
          key: ${{ runner.os }}-${{ hashFiles('flake.*', 'Cargo.*', '.cargo/**', 'crates/**') }}
      - name: nix-build
        run: |
          nix copy --no-check-sigs --from "file://$HOME/built" "$(nix eval --raw .#forno)" "$(nix eval --raw .#programs)" || true
          nix build -L
          nix copy --to "file://$HOME/built" .#forno .#programs
      - run: nix flake check -L
      - name: look
        run: |
          mkdir out
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build -o specimen ".#checks.$system.specimen"
          FORNO_WASM="$(nix eval --raw .#programs)" nix develop -c "$(nix eval --raw .#forno)/bin/forno" build --drafts
          find -L result specimen public -type f -exec shasum -a 256 {} + | sort -k 2 > out/files
          nix develop -c tinymist compile --root . content/drafts/specimen/index.typ editor.pdf
          nix shell --inputs-from . nixpkgs#poppler-utils -c pdffonts editor.pdf > out/fonts
          wc -c editor.pdf >> out/fonts
          for it in "packages.$system.default" "devShells.$system.default"; do
            nix path-info -Sh "$(nix build --no-link --print-out-paths ".#$it.inputDerivation")" >> out/sizes
          done
          nix path-info -r ./result >> out/sizes
          # shellcheck disable=SC2016
          nix develop -c sh -c 'command -v dot; env | grep "^TYPST\|^FORNO\|^GRAPHVIZ"; find -L "$TYPST_FONT_PATHS" -type f' > out/shell
          echo '#import "@preview/fletcher:0.5.8": *' >> content/colophon.typ
          FORNO_WASM="$(nix eval --raw .#programs)" nix develop -c "$(nix eval --raw .#forno)/bin/forno" build > out/missing 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ runner.os }}-${{ matrix.back }}
          path: out
          retention-days: 1
