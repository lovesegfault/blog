repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: [--enforce-all]
  - id: check-yaml
  - id: detect-private-key
  - id: end-of-file-fixer
    exclude: \.svg$
  - id: forbid-new-submodules
  - id: mixed-line-ending
  - id: trailing-whitespace

- repo: local
  hooks:
  - name: nixfmt
    entry: nixfmt
    files: \.nix$
    language: system
    description: Nix code formatter
    id: nixfmt
  - name: statix
    entry: statix check
    files: \.nix$
    language: system
    pass_filenames: false
    description: Nix code linter
    id: statix
  - id: typstyle
    name: typstyle
    entry: typstyle --inplace --line-width 120
    language: system
    files: \.typ$
  - id: rustfmt
    name: rustfmt
    entry: cargo fmt --all
    language: system
    files: \.rs$
    pass_filenames: false
  - id: clippy
    name: clippy
    entry: cargo clippy --workspace --all-targets -- --deny warnings
    language: system
    files: \.rs$
    pass_filenames: false
  - id: scrub
    name: scrub
    description: Keep the location of photos out of the repository
    entry: forno scrub
    language: system
    files: (?i)^(content|static)/|\.(jpe?g|png)$
    exclude: \.typ$
