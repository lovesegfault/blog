[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/forno"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
maud = "0.27"
rayon = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Firing murals and resizing photos crawl without optimization.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.mural]
opt-level = 3

# What is sent to browsers.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
